; =====================================================================
;  PlatformIO 工程配置（stm32-wearable-health-band）
;
;  两个环境：
;    env:band     目标板 STM32F405RGT6（真实固件）
;    env:native   PC 上跑单元测试（把固件当普通 C 程序编译）
;
;  原生环境用 platform = native，不需要任何第三方框架。
; =====================================================================

[platformio]
default_envs = native

; ---------------- 公共编译选项 ----------------
[band_common]
build_flags =
    -std=c99
    -Wall
    -Wextra
    -Iinclude
src_filter = +<../src/> +<../drivers/> +<../platform/>

; ---------------- 目标板：STM32F405RGT6 ----------------
[env:band]
platform = ststm32
board = genericSTM32F405RG
framework = none
upload_protocol = stlink
build_flags =
    ${band_common.build_flags}
    -DBAND_TARGET_STM32=1
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
    -Og
    -g3
build_src_filter =
    +<../src/>
    +<../drivers/>
    -<../platform/port_host.c>
    -<../platform/bus_sim.c>
    -<../platform/net_socket.c>
    -<../platform/main_host.c>
    +<../platform/port_stm32.c>
    +<../platform/bus_stm32.c>
    +<../platform/net_wifi_at.c>
    +<../platform/rtc_iwdg_port.c>
link_flags =
    -Wl,-Map,${BUILD_DIR}/band.map
    -Wl,--gc-sections
; 目标板上由 startup 提供 main()，见 docs/DESIGN.md 的启动流程说明

; ---------------- PC 原生：单元测试 ----------------
[env:native]
platform = native
build_flags =
    -std=c99
    -O2
    -Wall
    -Wextra
    -Wpedantic
    -Wshadow
    -Iinclude
    -DBAND_HOST_SIM=1
    -D_POSIX_C_SOURCE=200809L
build_src_filter =
    +<../src/>
    +<../drivers/>
    +<../platform/port_host.c>
    +<../platform/bus_sim.c>
    +<../platform/net_socket.c>
    +<../platform/net_wifi_at.c>
    +<../platform/rtc_iwdg_port.c>
    +<../test/test_util.c>
    +<../test/test_frame_codec.c>
    +<../test/test_step_counter.c>
    +<../test/test_ws_client.c>
    +<../test/test_power_mgr.c>
    +<../test/test_drivers.c>
    +<../test/test_uplink.c>
    +<../test/run_tests.c>
    -<../platform/main_host.c>
